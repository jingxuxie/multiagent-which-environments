name: Reproduce research and manuscript
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cooperation-reproduce-main
  cancel-in-progress: false
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Materialize hash-verified initial source package
        run: |
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import base64, hashlib, json, lzma
          chunks = sorted(Path('bootstrap').glob('chunk*.b64'))
          if chunks:
              assert len(chunks) == 7
              encoded = ''.join(p.read_text().strip() for p in chunks)
              packed = base64.b64decode(encoded, validate=True)
              assert hashlib.sha256(packed).hexdigest() == 'cd981907b422da7405c27e2f760e967d6c0922f427424dc91c321446bffbbb95'
              data = lzma.decompress(packed)
              assert len(data) < 2000000
              files = json.loads(data)
              assert len(files) == 23
              for name, content in files.items():
                  path = PurePosixPath(name)
                  assert not path.is_absolute() and '..' not in path.parts
                  assert path.parts[0] not in ('.git', '.github', 'bootstrap')
                  assert isinstance(content, str)
                  dest = Path(name)
                  assert not dest.is_symlink()
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  dest.write_text(content)
              for chunk in chunks: chunk.unlink()
              Path('bootstrap').rmdir()
              print('Materialized 23 verified source files')
          PY
      - name: Install scientific dependencies
        run: python -m pip install -e '.[test]'
      - name: Theory and implementation tests
        run: python -m pytest -q
      - name: Reproduce scientific data and reference endpoints
        run: |
          python experiments/run_all.py
          python experiments/report.py
          python experiments/verify_reference.py
      - name: Install LaTeX
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-extra texlive-fonts-recommended lmodern
      - name: Compile and check manuscript
        run: bash scripts/build_paper.sh
      - name: Upload complete research artifact
        uses: actions/upload-artifact@v4
        with:
          name: cooperation-paper-and-results
          if-no-files-found: error
          path: |
            paper/main.pdf
            paper/main.tex
            paper/references.bib
            results/
            figures/
            docs/
      - name: Publish verified source and generated artifacts
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Publish verified cooperation proofs, experiments, and manuscript [skip ci]'
            git push origin HEAD:main
          fi
